name: site

on:
  push:
    branches: [main]
  schedule:
    # GitHub cron is UTC and often late, so avoid the top of the hour and start a little early.
    - cron: '17 23 * * 0-4' # 07:17 Taiwan Mon–Fri: previous TW close + last night's US close
    - cron: '17 12 * * 1-5' # 1 h before the US open in summer (EDT); skipped in winter
    - cron: '17 13 * * 1-5' # 1 h before the US open in winter (EST); skipped in summer
  workflow_dispatch:
    inputs:
      force_fetch:
        description: 重新抓取每日資料（關閉則只用 data 分支現有資料重新部署）
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check out the data branch into ./store
        run: |
          mkdir -p store
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --no-tags --depth 1 origin +refs/heads/data:refs/remotes/origin/data
            git archive refs/remotes/origin/data | tar -x -C store
            echo "data branch loaded"
          else
            echo "data branch does not exist yet; it will be created"
          fi

      - name: Decide whether to fetch
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          FORCE_FETCH: ${{ github.event.inputs.force_fetch }}
          STORE: store
        run: node scripts/decide.mjs

      - name: Fetch daily data
        if: steps.decide.outputs.fetch == 'true'
        env:
          MAX_BOOTSTRAP: '1500'
          BOOTSTRAP_MINUTES: '30'
        run: node scripts/fetch-data.mjs --store store --out store

      - name: Push the data branch (single orphan commit)
        if: steps.decide.outputs.fetch == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd store
          rm -rf .git
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "daily data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/data

      - name: Build _site
        if: steps.decide.outputs.deploy == 'true'
        run: |
          if [ ! -f store/latest/meta.json ]; then
            echo "::error::store/latest/meta.json is missing; nothing to deploy"
            exit 1
          fi
          mkdir -p _site/data
          cp index.html _site/
          if [ -d assets ]; then cp -R assets _site/; fi
          for f in favicon.ico favicon.svg favicon.png apple-touch-icon.png site.webmanifest manifest.webmanifest robots.txt; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          cp -R store/latest _site/data/latest
          du -sh _site

      - name: Configure Pages
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
